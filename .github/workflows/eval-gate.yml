name: eval-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run eval gate
        if: ${{ !cancelled() }}
        run: python -m eval_gate.runner --output-dir runs
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: runs/
          if-no-files-found: error
