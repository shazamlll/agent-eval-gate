# promptfoo port of the agent-eval-gate demo eval (first 5 cases).
# Offline run: the provider is the repo's own stub answerer, and the
# assertions are the deterministic equivalents of the rubric in
# eval_gate/judge.py (gold facts must appear, distractors must not).
# The llm-rubric variant lives in promptfooconfig.llm.yaml and needs
# OPENAI_API_KEY -- it is NOT run here.
description: "agent-eval-gate demo: bookstore retrieval QA, first 5 cases (offline)"

providers:
  - file://stub_provider.py

prompts:
  - "You are a helpful assistant for a fictional online bookstore. Answer the question using only the catalog.\n\nQuestion: {{question}}\n\nAnswer:"

tests:
  - vars:
      question: "Which books did Ada Marsh write?"
      gold_facts: "The Clockmaker's Daughter; Salt & Cinder"
      distractor: "(none)"
    assert:
      - type: contains
        value: "The Clockmaker's Daughter"
      - type: contains
        value: "Salt & Cinder"
  - vars:
      question: "How much does 'The Clockmaker's Daughter' cost?"
      gold_facts: "$18.99"
      distractor: "$24.50"
    assert:
      - type: contains
        value: "$18.99"
      - type: not-contains
        value: "$24.50"
  - vars:
      question: "Is 'The Cartographer's Apprentice' in stock?"
      gold_facts: "out of stock"
      distractor: "is in stock"
    assert:
      - type: contains
        value: "out of stock"
      - type: not-contains
        value: "is in stock"
  - vars:
      question: "Which fantasy books are in the catalog?"
      gold_facts: "Salt & Cinder; Storms Over Aldermere"
      distractor: "(none)"
    assert:
      - type: contains
        value: "Salt & Cinder"
      - type: contains
        value: "Storms Over Aldermere"
  - vars:
      question: "What is the cheapest book in the catalog?"
      gold_facts: "How to Build a Treehouse; $12.99"
      distractor: "A Field Guide to Vanishing Birds"
    assert:
      - type: contains
        value: "How to Build a Treehouse"
      - type: contains
        value: "$12.99"
      - type: not-contains
        value: "A Field Guide to Vanishing Birds"
